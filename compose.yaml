# Trustvian + LangGraph quick start, as a Compose stack.
#
#   control-plane   trustvian-local (SQLite in a named volume) + WebUI on
#                   http://127.0.0.1:8080/
#   crm             the fake CRM (mock_services.py)
#   agent           one-shot: `trustvian dev` + the LangGraph workload, attached
#                   to control-plane with --api-url. Used with `run`, never `up`.
#   live            long-running: live.py, three agents that keep working
#                   until stopped, each its own `trustvian dev` run attached to
#                   control-plane. Only with `--profile live`.
#   ollama          the model server (CPU inference, models in a named volume)
#   ollama-pull     one-shot: pulls the LLM_MODEL into ollama, then exits; the
#                   agent waits for it, so the first run never races the pull
#
# Quick path:
#   docker compose --profile agent build  # all images, the agent's included
#   docker compose up -d                  # first start also pulls the model
#   docker compose run --rm agent reference
#   docker compose run --rm agent candidate
#   docker compose run --rm agent compare
#
# Live mode:
#   docker compose --profile live up -d   # then open http://127.0.0.1:8080/
#   docker compose --profile live down    # stops it; runs and baselines are kept
#
# Everything configurable lives in .env (see .env.example).

name: trustvian-langgraph-quickstart

services:
  control-plane:
    build:
      context: .
      target: control-plane
      args:
        TRUSTVIAN_REF: ${TRUSTVIAN_REF:-v0.11.0}
    volumes:
      # Named, so `docker compose down` keeps runs and baselines and only
      # `docker compose down -v` discards them.
      - trustvian-state:/var/lib/trustvian
    ports:
      # Host loopback only: the runtime is unauthenticated.
      - "127.0.0.1:${TRUSTVIAN_WEB_PORT:-8080}:8080"
    healthcheck:
      # Asked of the loopback listener itself, not the relay: a healthy
      # runtime is what the agent waits for.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/v1/projects?limit=1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  crm:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./mock_services.py:/app/mock_services.py:ro
    environment:
      CRM_BIND: 0.0.0.0
      CRM_PORT: "8081"
      # The share of requests answered 503 (429 for refunds): live mode's
      # occasional failed call. 0 turns it off.
      CRM_ERROR_RATE: ${CRM_ERROR_RATE:-0.05}
    command: ["python", "-u", "mock_services.py"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/customers/c-1001', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  agent:
    build:
      context: .
      target: agent
      args:
        TRUSTVIAN_REF: ${TRUSTVIAN_REF:-v0.11.0}
        # The Collector is the official release image, pinned by digest;
        # the Dockerfile copies its binary in beside the CLI.
        TRUSTVIAN_COLLECTOR_IMAGE: ${TRUSTVIAN_COLLECTOR_IMAGE:-ghcr.io/trustvian/trustvian-collector:v0.11.0@sha256:643532142a8ebeabb7504fd4b591c77615a4495e0e5c478462b40f865113bddc}
    # Not started by `docker compose up`; only by `docker compose run agent …`.
    profiles: ["agent"]
    volumes:
      # The workload is mounted, not baked in: edit graph.py or tools.py and
      # re-run. Read-only, because `trustvian dev` never writes to the
      # workload's directory and neither should anything else here.
      - .:/app:ro
      # dev's own state (generated Collector config, logs, the learned
      # baseline per candidate) — kept so a second reference run is scored
      # against what the first one taught.
      - agent-state:/root/.trustvian
    environment:
      TRUSTVIAN_API_URL: http://control-plane:8080
      TRUSTVIAN_PROJECT: ${TRUSTVIAN_PROJECT:-trustvian-langgraph-quickstart}
      TRUSTVIAN_AGENT: ${TRUSTVIAN_AGENT:-support-graph}
      TRUSTVIAN_WEB_URL: http://127.0.0.1:${TRUSTVIAN_WEB_PORT:-8080}/
      CRM_URL: http://crm:8081
      # The model. Default: ChatOllama against the ollama service of this
      # stack. The model must support tool calling (gemma3 does not: Ollama
      # answers 400 "does not support tools").
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      # OLLAMA_HOST is what ChatOllama reads. It is set from OLLAMA_URL, not
      # from an OLLAMA_HOST of the same name, because the host's shell often
      # exports OLLAMA_HOST for its own Ollama (0.0.0.0 on Linux) and Compose
      # would take that over .env.
      OLLAMA_HOST: ${OLLAMA_URL:-http://ollama:11434}
      # Non-empty switches graph.py to ChatOpenAI against this
      # OpenAI-compatible endpoint (vLLM, OpenAI, an Ollama's /v1).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # LangChain's own tracer, off: it would send every prompt and completion
      # to a hosted backend, outside the content-free spans below. Never
      # OTEL_SDK_DISABLED, which dev refuses.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      # Content-free spans: prompts, completions, messages and tool arguments
      # stay out of telemetry.
      OPENINFERENCE_HIDE_INPUTS: ${OPENINFERENCE_HIDE_INPUTS:-true}
      OPENINFERENCE_HIDE_OUTPUTS: ${OPENINFERENCE_HIDE_OUTPUTS:-true}
      OPENINFERENCE_HIDE_INPUT_MESSAGES: ${OPENINFERENCE_HIDE_INPUT_MESSAGES:-true}
      OPENINFERENCE_HIDE_OUTPUT_MESSAGES: ${OPENINFERENCE_HIDE_OUTPUT_MESSAGES:-true}
    extra_hosts:
      # Makes host.docker.internal work on Linux too (Docker Desktop has it
      # built in).
      - "host.docker.internal:host-gateway"
    depends_on:
      control-plane:
        condition: service_healthy
      crm:
        condition: service_healthy
      # Waits for the pull, not just for the server: an ollama that is up
      # but still downloading answers "model not found".
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

  live:
    # The agent service's image, mounts and environment, as a long-running
    # service: `python live.py`, which starts one `trustvian dev` per role
    # (three dev processes and three Collectors in this one container), each
    # attached to control-plane with TRUSTVIAN_API_URL. Started only with
    # `--profile live`; the one-shot agent service is unchanged.
    extends:
      service: agent
    profiles: !override ["live"]
    command: ["live"]
    volumes:
      # dev's state of its own, so the one-shot agent's housekeeping (it
      # clears stale baseline locks) never touches the live runs'.
      - live-state:/root/.trustvian
    environment:
      # Inherited from agent: TRUSTVIAN_API_URL (the control plane every
      # dev attaches to) and TRUSTVIAN_PROJECT. Each dev's --agent is
      # <role>-agent.
      LIVE_AGENTS: ${LIVE_AGENTS:-support,billing,accounts}
      LIVE_INTERVAL_SECONDS: ${LIVE_INTERVAL_SECONDS:-10}
      LIVE_DRIFT_EVERY: ${LIVE_DRIFT_EVERY:-20}
      LIVE_MAX_TICKETS: ${LIVE_MAX_TICKETS:-0}
      PYTHONUNBUFFERED: "1"
    # `down` sends live.py SIGTERM; it sends every dev SIGINT, so each
    # completes its run, and kills what is left after 20 s.
    stop_grace_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # One model resident at a time, kept loaded between runs so the second
      # run does not pay the load again.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    # Not published: only the agent talks to it, over the Compose network.
    # (Publishing 11434 would also collide with an Ollama app on the host.)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    environment:
      # Where this service pulls into: always this stack's ollama. The
      # Ollama the agent will ask (OLLAMA_URL) is compared with it below.
      TARGET: http://ollama:11434
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    # Pulls LLM_MODEL when the agent will ask THIS ollama for it; a model
    # served elsewhere (the host's Ollama, vLLM, OpenAI) is not this
    # service's to pull. `ollama pull` of a model already present only checks
    # the manifest, so every `up` after the first is quick.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$LLM_BASE_URL" ]; then
          echo "ollama-pull: LLM_BASE_URL=$$LLM_BASE_URL is set; the agent uses that endpoint; nothing to pull"; exit 0
        fi
        case "$$OLLAMA_URL" in
          "$$TARGET"*) ;;
          *) echo "ollama-pull: OLLAMA_URL=$$OLLAMA_URL is not this stack's ollama; nothing to pull"; exit 0 ;;
        esac
        echo "ollama-pull: pulling $$LLM_MODEL (first time: a few minutes)"
        OLLAMA_HOST="$$TARGET" ollama pull "$$LLM_MODEL" && echo "ollama-pull: $$LLM_MODEL ready"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  trustvian-state:
  agent-state:
  live-state:
  ollama-models:
